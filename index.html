<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>文文爱不爱老公</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%);
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }

  /* 背景漂浮爱心 */
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .heart-fly {
    position: absolute; bottom: -40px;
    font-size: 24px; opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .8; }
    90%  { opacity: .6; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    position: relative; z-index: 1;
    width: min(88vw, 400px);
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 40px 28px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(214, 51, 132, .35);
    animation: popIn .5s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes popIn {
    from { transform: scale(.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .emoji { font-size: 64px; display: block; margin-bottom: 12px; animation: bounce 1.6s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  h1 {
    font-size: 34px;
    color: #d63384;
    background: linear-gradient(90deg, #e94c8f, #a945e9);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
    letter-spacing: 2px;
  }
  .sub { color: #888; font-size: 15px; margin-bottom: 34px; }
  .sub b { color: #d63384; }

  .btn {
    border: none; cursor: pointer;
    font-size: 22px; font-weight: 700;
    padding: 16px 40px;
    border-radius: 999px;
    transition: transform .12s ease, box-shadow .2s ease;
    font-family: inherit;
  }
  .btn-yes {
    background: linear-gradient(135deg, #ff5e8a, #ff2d78);
    color: #fff;
    box-shadow: 0 8px 24px rgba(255, 45, 120, .45);
  }
  .btn-yes:active { transform: scale(.94); }

  .btn-no {
    position: fixed; z-index: 10;
    background: #e5e5ea; color: #8a8a8f;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    transition: none;
  }
  .btn-no:active { transform: scale(.9); }

  .hint {
    margin-top: 26px; font-size: 13px; color: #bbb;
  }

  /* "就知道你爱"过渡画面 */
  .transition {
    position: fixed; inset: 0; z-index: 15;
    background: linear-gradient(160deg, #ff2d78, #a945e9);
    display: none; align-items: center; justify-content: center;
    animation: fadeIn .3s ease;
  }
  .transition.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .transition .t-wrap { text-align: center; color: #fff; padding: 20px; animation: tPop .5s cubic-bezier(.2, 1.6, .4, 1); }
  .transition .t-wrap .t-emoji { font-size: 80px; display: block; margin-bottom: 16px; }
  .transition .t-wrap h2 { font-size: 40px; text-shadow: 0 4px 16px rgba(0,0,0,.25); letter-spacing: 4px; }
  @keyframes tPop {
    from { transform: scale(.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* 最终庆祝 */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: linear-gradient(160deg, #ff2d78, #a945e9);
    display: none; align-items: center; justify-content: center;
    animation: fadeIn .4s ease;
  }
  .overlay.show { display: flex; }
  .overlay .win { text-align: center; color: #fff; padding: 20px; }
  .overlay .win .big { font-size: 72px; }
  .overlay .win h2 { font-size: 38px; margin: 18px 0 10px; text-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .overlay .win p { font-size: 16px; opacity: .9; line-height: 1.8; }
  .overlay .win .note { margin-top: 28px; font-size: 13px; opacity: .7; }

  .confetti {
    position: absolute; width: 12px; height: 12px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="card">
  <!-- 第一层：文文爱不爱老公 -->
  <div id="layer1">
    <span class="emoji">🐻</span>
    <h1>文文爱不爱老公</h1>
    <p class="sub">乖，选一个吧～点 <b>爱</b> 就进入下一关 ❤️</p>
    <div class="btn-row"><button class="btn btn-yes" id="btnYes1">爱 ❤️</button></div>
    <p class="hint" id="hint1">提示：只能点"爱"哦～</p>
  </div>

  <!-- 第二层：叫爸爸 -->
  <div id="layer2" style="display:none">
    <span class="emoji">👨</span>
    <h1>叫爸爸！</h1>
    <p class="sub">乖，叫爸爸就放你走～点 <b>爸爸</b> 就能退出啦</p>
    <div class="btn-row"><button class="btn btn-yes" id="btnYes2">爸爸 👨</button></div>
    <p class="hint" id="hint2">提示：只能点"爸爸"才能退出哦～</p>
  </div>
</div>

<!-- 两个会躲的坏按钮 -->
<button class="btn btn-no" id="btnNo1">不爱 😠</button>
<button class="btn btn-no" id="btnNo2" style="display:none">不叫 😤</button>

<!-- "就知道你爱"过渡 -->
<div class="transition" id="transition">
  <div class="t-wrap">
    <span class="t-emoji">😘</span>
    <h2>就知道你爱～</h2>
  </div>
</div>

<!-- 最终庆祝 -->
<div class="overlay" id="overlay">
  <div class="win">
    <div class="big">💞</div>
    <h2>真乖！爸爸爱你 ❤️</h2>
    <p>文文最乖了～<br>亲亲抱抱举高高 🥰</p>
    <div class="note">现在可以放心退出页面啦</div>
  </div>
</div>

<script>
(function () {
  var heartsBox = document.getElementById('hearts');
  var hint1 = document.getElementById('hint1');
  var hint2 = document.getElementById('hint2');
  var layer1 = document.getElementById('layer1');
  var layer2 = document.getElementById('layer2');
  var btnYes1 = document.getElementById('btnYes1');
  var btnYes2 = document.getElementById('btnYes2');
  var btnNo1 = document.getElementById('btnNo1');
  var btnNo2 = document.getElementById('btnNo2');
  var transition = document.getElementById('transition');
  var overlay = document.getElementById('overlay');
  var done = false;

  // 背景漂浮爱心
  var heartEmojis = ['💗','💖','💕','💘','💝','❤️'];
  for (var i = 0; i < 18; i++) {
    var h = document.createElement('span');
    h.className = 'heart-fly';
    h.textContent = heartEmojis[i % heartEmojis.length];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 24) + 'px';
    h.style.animationDuration = (6 + Math.random() * 8) + 's';
    h.style.animationDelay = (Math.random() * 8) + 's';
    heartsBox.appendChild(h);
  }

  // 通用躲闪逻辑（台词全部站在"老公/爸爸"视角）
  function makeDodger(btn, hint, yesBtn, noTexts, hintTexts) {
    var dodgeCount = 0;
    function dodge() {
      dodgeCount++;
      var maxW = window.innerWidth - btn.offsetWidth - 10;
      var maxH = window.innerHeight - btn.offsetHeight - 10;
      var x = Math.random() * Math.max(maxW, 10);
      var y = Math.random() * Math.max(maxH, 10);
      // 尽量别躲到"正确"按钮上面
      var yesRect = yesBtn.getBoundingClientRect();
      for (var t = 0; t < 5; t++) {
        if (x < yesRect.right + 20 && x + btn.offsetWidth > yesRect.left - 20 &&
            y < yesRect.bottom + 20 && y + btn.offsetHeight > yesRect.top - 20) {
          x = Math.random() * Math.max(maxW, 10);
          y = Math.random() * Math.max(maxH, 10);
        } else break;
      }
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      var scale = Math.max(0.62, 1 - dodgeCount * 0.06);
      btn.style.transform = 'scale(' + scale + ') rotate(' + (Math.random() * 30 - 15) + 'deg)';
      if (dodgeCount > 2) {
        btn.textContent = noTexts[Math.min(dodgeCount - 1, noTexts.length - 1)];
      }
      hint.textContent = hintTexts[Math.min(dodgeCount - 1, hintTexts.length - 1)];
    }
    btn.addEventListener('mouseenter', function () { if (!done && btn.style.display !== 'none') dodge(); });
    btn.addEventListener('touchstart', function (e) { if (!done && btn.style.display !== 'none') { e.preventDefault(); dodge(); } }, { passive: false });
    btn.addEventListener('click', function (e) { if (!done && btn.style.display !== 'none') { e.preventDefault(); e.stopPropagation(); dodge(); } });
  }

  // 第一层：不爱 会躲（老公视角：催文文点"爱"）
  makeDodger(btnNo1, hint1, btnYes1,
    ['不爱 😠','就不给你点~','乖嘛~点爱嘛~','点爱爱嘛~','快选爱嘛~','就剩爱啦~','听话，点爱~'],
    ['就不给你点！','乖嘛，点爱嘛～','快选爱嘛～','只剩爱可以点啦～','听话，乖乖点爱～','乖，点爱就让你过关～']);

  // 第二层：不叫 会躲（老公/爸爸视角：催文文叫爸爸）
  makeDodger(btnNo2, hint2, btnYes2,
    ['不叫 😤','快叫嘛~','乖嘛~叫嘛~','就不给你点！','快点叫爸爸~','叫嘛叫嘛~','乖乖叫嘛~'],
    ['就不给你点！','快叫嘛～','乖嘛～叫嘛～','快点叫爸爸！','叫嘛叫嘛～','乖乖叫爸爸，就让你退出～']);

  // 第一关通过：点"爱" → 过渡 → 进入第二层
  btnYes1.addEventListener('click', function () {
    if (done) return;
    btnNo1.style.display = 'none';
    layer1.style.display = 'none';
    transition.classList.add('show');
    setTimeout(function () {
      transition.classList.remove('show');
      layer2.style.display = '';
      // 把"不叫"按钮放出来，先给它一个初始随机位置
      btnNo2.style.display = '';
      var maxW = window.innerWidth - btnNo2.offsetWidth - 10;
      var maxH = window.innerHeight - btnNo2.offsetHeight - 10;
      btnNo2.style.left = (Math.random() * Math.max(maxW, 10)) + 'px';
      btnNo2.style.top = (Math.random() * Math.max(maxH, 10)) + 'px';
    }, 1600);
  });

  // 第二关通过：点"爸爸" → 最终庆祝 → 允许退出
  btnYes2.addEventListener('click', function () {
    if (done) return;
    done = true;
    btnNo2.style.display = 'none';
    hint2.style.display = 'none';
    showCelebration();
  });

  function showCelebration() {
    overlay.classList.add('show');
    var colors = ['#ffe066', '#ff8fb3', '#7ef7ff', '#b6ff8f', '#ffffff'];
    for (var i = 0; i < 70; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-5vh';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.width = (6 + Math.random() * 10) + 'px';
      c.style.height = (8 + Math.random() * 12) + 'px';
      c.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      overlay.appendChild(c);
    }
  }

  // 没点完"爸爸"之前，不让轻易退出页面
  window.addEventListener('beforeunload', function (e) {
    if (!done) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
})();
</script>
</body>
</html>
